<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Trader | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #050a0e;
            --bg-sidebar: #0f171e;
            --bg-card: #1a242d;
            --bg-input: #0b1116;
            --accent: #b1ff00;
            --danger: #ff3b3b;
            --text-white: #ffffff;
            --text-gray: #8a99a6;
            --border: #2d3841;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Roboto', sans-serif; 
            background: var(--bg-body); 
            color: var(--text-white); 
            margin: 0; 
            display: flex; 
            min-height: 100vh;
        }

        /* SIDEBAR FIXA E ORGANIZADA */
        .sidebar { 
            width: 260px; 
            background: var(--bg-sidebar); 
            border-right: 1px solid var(--border); 
            padding: 30px 20px; 
            display: flex; 
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 1000;
        }

        .logo { 
            font-family: 'Roboto Condensed'; 
            font-size: 24px; 
            color: var(--accent); 
            margin-bottom: 50px; 
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .menu-item { 
            padding: 15px; 
            border-radius: 8px; 
            color: var(--accent); 
            background: rgba(177, 255, 0, 0.05);
            font-size: 14px; 
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            border: 1px solid rgba(177, 255, 0, 0.2);
        }

        .btn-logout {
            margin-top: auto;
            background: rgba(255, 59, 59, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 6px;
            transition: 0.3s;
        }
        .btn-logout:hover { background: var(--danger); color: white; }

        /* ÁREA DE CONTEÚDO COM ESPAÇAMENTO REFORÇADO */
        .main-container {
            flex: 1;
            margin-left: 260px; /* IMPORTANTE: Cria o espaço para a sidebar */
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .content-wrapper {
            width: 100%;
            max-width: 1200px;
        }

        /* BOXES DE STATUS (LUCRO / BANCA) */
        .stats-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 25px; 
            margin-bottom: 35px; 
        }

        .stat-card { 
            background: var(--bg-card); 
            padding: 25px; 
            border-radius: 12px; 
            border-bottom: 4px solid var(--accent); 
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .stat-card small { 
            color: var(--text-gray); 
            font-size: 12px; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            display: block; 
            margin-bottom: 10px; 
        }

        .stat-card div { font-size: 28px; font-weight: 700; }

        /* FORMULÁRIO DE ENTRADA */
        .entry-card { 
            background: var(--bg-card); 
            border-radius: 12px; 
            padding: 30px; 
            margin-bottom: 40px; 
            border: 1px solid var(--border); 
        }

        .form-row { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
            gap: 15px; 
        }

        input { 
            background: var(--bg-input); 
            border: 1px solid var(--border); 
            color: white; 
            padding: 14px; 
            border-radius: 6px; 
            font-size: 14px;
            width: 100%;
            transition: 0.3s;
        }
        input:focus { border-color: var(--accent); outline: none; }

        .btn-save { 
            background: var(--accent); 
            color: #000; 
            border: none; 
            padding: 18px; 
            font-weight: 900; 
            border-radius: 6px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 25px; 
            text-transform: uppercase;
            font-size: 15px;
            letter-spacing: 1px;
        }
        .btn-save:hover { background: #96d800; transform: translateY(-2px); }

        /* TABELA COM SCROLL PARA NÃO QUEBRAR */
        .table-container { 
            background: var(--bg-card); 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            overflow-x: auto; 
            padding: 10px;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            min-width: 1000px; /* Garante que as colunas não amassem */
        }

        th { 
            color: var(--text-gray); 
            font-size: 11px; 
            padding: 20px 10px; 
            text-transform: uppercase; 
            text-align: center;
            border-bottom: 2px solid var(--border);
        }

        td { 
            padding: 18px 10px; 
            border-bottom: 1px solid var(--border); 
            font-size: 13px; 
            text-align: center;
        }

        .pos { color: var(--accent); font-weight: bold; }
        .neg { color: var(--danger); font-weight: bold; }

        .btn-del {
            background: rgba(255,255,255,0.05);
            border: 1px solid #444;
            color: #888;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 11px;
        }
        .btn-del:hover { border-color: var(--danger); color: var(--danger); }

        /* TELA DE LOGIN */
        #auth-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--bg-body); display: flex; align-items: center; 
            justify-content: center; z-index: 10000; 
        }
        .auth-box { 
            background: var(--bg-card); padding: 50px; border-radius: 15px; 
            border: 1px solid var(--accent); text-align: center; width: 350px;
            box-shadow: 0 0 30px rgba(177, 255, 0, 0.15);
        }
        body.logged-in #auth-screen { display: none; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <div class="logo">⚡ ELITE ACCESS</div>
            <input type="email" id="email" placeholder="E-mail" style="margin-bottom:15px">
            <input type="password" id="pass" placeholder="Senha" style="margin-bottom:25px">
            <button class="btn-save" id="btn-login" style="margin:0">ACESSAR SISTEMA</button>
        </div>
    </div>

    <aside class="sidebar">
        <div class="logo">⚡ ELITE TRADER</div>
        <div class="menu-item">⚽ UNDER LIMIT</div>
        <button class="btn-logout" id="btn-logout">SAIR / LOGOUT</button>
    </aside>

    <div class="main-container">
        <div class="content-wrapper">
            
            <div class="stats-grid">
                <div class="stat-card">
                    <small>Lucro Total Acumulado</small>
                    <div id="display-lucro">R$ 0,00</div>
                </div>
                <div class="stat-card">
                    <small>Banca Atual Estimada</small>
                    <div id="display-banca" style="color: var(--accent)">R$ 100,00</div>
                </div>
            </div>

            <section class="entry-card">
                <div class="form-row">
                    <input type="date" id="f-data">
                    <input type="text" id="f-tA" placeholder="Mandante">
                    <input type="text" id="f-tB" placeholder="Visitante">
                    <input type="text" id="f-lg" placeholder="Liga">
                    <input type="text" id="f-pl" placeholder="Placar">
                    <input type="number" step="0.01" id="f-oe" placeholder="Odd Entrada">
                    <input type="number" step="0.01" id="f-os" placeholder="Odd Saída">
                    <input type="number" id="f-ent" placeholder="Stake (R$)">
                    <input type="number" id="f-sai" placeholder="Retorno (R$)">
                </div>
                <button class="btn-save" id="btn-add">SALVAR OPERAÇÃO NA NUVEM</button>
            </section>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Evento</th>
                            <th>Liga</th>
                            <th>Placar</th>
                            <th>Odd E</th>
                            <th>Odd S</th>
                            <th>Stake</th>
                            <th>Retorno</th>
                            <th>P/L</th>
                            <th style="color: var(--accent)">% Stake</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCI0iUANVLaxqJJ351bpHkUmktGljPO7jQ",
            authDomain: "elitetraderconect.firebaseapp.com",
            databaseURL: "https://elitetraderconect-default-rtdb.firebaseio.com",
            projectId: "elitetraderconect",
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // Autenticação
        document.getElementById('btn-login').onclick = () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value)
                .catch(err => alert("Erro: " + err.message));
        };
        document.getElementById('btn-logout').onclick = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) { document.body.classList.add('logged-in'); carregarDados(); }
            else { document.body.classList.remove('logged-in'); }
        });

        let databaseItems = [];

        function carregarDados() {
            onValue(ref(db, 'trades_under'), (snapshot) => {
                databaseItems = snapshot.val() || [];
                atualizarUI();
            });
        }

        document.getElementById('btn-add').onclick = () => {
            const dateVal = document.getElementById('f-data').value;
            if(!dateVal) return alert("Selecione a data!");

            const novoTrade = {
                data: dateVal.split('-').reverse().slice(0,2).join('/'),
                tA: document.getElementById('f-tA').value || '-',
                tB: document.getElementById('f-tB').value || '-',
                lg: document.getElementById('f-lg').value || '-',
                pl: document.getElementById('f-pl').value || '-',
                oe: parseFloat(document.getElementById('f-oe').value) || 0,
                os: parseFloat(document.getElementById('f-os').value) || 0,
                ent: parseFloat(document.getElementById('f-ent').value) || 0,
                sai: parseFloat(document.getElementById('f-sai').value) || 0
            };

            databaseItems.push(novoTrade);
            set(ref(db, 'trades_under'), databaseItems);
            // Limpar campos
            document.querySelectorAll('input:not([type="date"])').forEach(i => i.value = "");
        };

        function atualizarUI() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            let totalPL = 0;

            databaseItems.forEach((t, i) => {
                const lucro = t.sai - t.ent;
                totalPL += lucro;
                const perc = t.ent > 0 ? (lucro / t.ent * 100) : 0;
                const cor = lucro >= 0 ? 'pos' : 'neg';

                tbody.innerHTML += `
                    <tr>
                        <td>${t.data}</td>
                        <td style="font-weight:700">${t.tA} x ${t.tB}</td>
                        <td>${t.lg}</td>
                        <td>${t.pl}</td>
                        <td>${t.oe.toFixed(2)}</td>
                        <td>${t.os.toFixed(2)}</td>
                        <td>R$ ${t.ent.toFixed(2)}</td>
                        <td>R$ ${t.sai.toFixed(2)}</td>
                        <td class="${cor}">R$ ${lucro.toFixed(2)}</td>
                        <td class="${cor}">${perc.toFixed(2)}%</td>
                        <td><button class="btn-del" onclick="window.remover(${i})">APAGAR</button></td>
                    </tr>
                `;
            });

            document.getElementById('display-lucro').innerText = `R$ ${totalPL.toFixed(2)}`;
            document.getElementById('display-banca').innerText = `R$ ${(100 + totalPL).toFixed(2)}`;
        }

        window.remover = (index) => {
            if(confirm("Deseja mesmo excluir este registro?")) {
                databaseItems.splice(index, 1);
                set(ref(db, 'trades_under'), databaseItems);
            }
        };
    </script>
</body>
</html>
