<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Trader | Secure Cloud Sync</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #050a0e; --bg-sidebar: #0f171e; --bg-card: #1a242d;
            --bg-input: #0b1116; --accent: #b1ff00; --danger: #ff3b3b;
            --edit: #ffcc00; --text-white: #ffffff; --text-gray: #8a99a6; --border: #2d3841;
            --cs-accent: #00d4ff;
        }

        body { font-family: 'Roboto', sans-serif; background: var(--bg-body); color: var(--text-white); margin: 0; display: flex; min-height: 100vh; overflow-x: hidden; }
        
        .sidebar { width: 240px; background: var(--bg-sidebar); border-right: 1px solid var(--border); padding: 20px; flex-shrink: 0; display: flex; flex-direction: column; }
        .logo { font-family: 'Roboto Condensed'; font-size: 22px; color: var(--accent); margin-bottom: 40px; text-decoration: none; padding-top: 20px; text-align: center; }
        .menu-item { padding: 12px; border-radius: 6px; color: var(--text-gray); cursor: pointer; transition: 0.3s; margin-bottom: 10px; font-size: 13px; font-weight: bold; }
        .menu-item:hover, .menu-item.active { background: var(--bg-card); color: var(--accent); }

        .main-content { flex: 1; padding: 60px 40px; overflow-y: auto; }
        .page { display: none; }
        .page.active { display: block; }

        .stats-header { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 40px; }
        .stat-box { background: var(--bg-card); padding: 15px; border-radius: 8px; border-bottom: 3px solid var(--accent); text-align: center; }
        .stat-box small { color: var(--text-gray); font-size: 9px; text-transform: uppercase; display: block; margin-bottom: 5px; }
        
        .market-card { background: var(--bg-card); border-radius: 12px; padding: 30px; margin-bottom: 35px; border: 1px solid var(--border); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; align-items: end; }
        
        input, select { background: var(--bg-input); border: 1px solid var(--border); color: white; padding: 12px; border-radius: 4px; width: 100%; box-sizing: border-box; }

        .btn-submit { background: var(--accent); color: black; border: none; padding: 15px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 20px; }

        .table-card { background: var(--bg-card); border-radius: 8px; overflow-x: auto; border: 1px solid var(--border); padding: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: center; min-width: 1000px; }
        th { background: #232e38; color: var(--text-gray); font-size: 10px; padding: 15px; text-transform: uppercase; }
        td { padding: 12px 5px; border-bottom: 1px solid var(--border); font-size: 12px; }
        .pos { color: var(--accent); font-weight: bold; }
        .neg { color: var(--danger); font-weight: bold; }
        
        #auth-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-body); display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .auth-box { background: var(--bg-card); padding: 40px; border-radius: 12px; border: 1px solid var(--accent); text-align: center; }
        body.logged-in #auth-container { display: none; }
    </style>
</head>
<body>

    <div id="auth-container">
        <div class="auth-box">
            <h2>ELITE ACCESS</h2>
            <input type="email" id="login-email" placeholder="E-mail" style="margin-bottom:10px">
            <input type="password" id="login-password" placeholder="Senha" style="margin-bottom:10px">
            <button class="btn-submit" id="btn-login">ACESSAR</button>
        </div>
    </div>

    <div id="main-app">
        <aside class="sidebar">
            <div class="logo">⚡ ELITE TRADER</div>
            <div class="menu-item active">⚽ UNDER LIMIT</div>
            <button id="btn-logout" style="margin-top:auto; background:none; border:1px solid red; color:red; cursor:pointer; padding:5px">SAIR</button>
        </aside>

        <main class="main-content">
            <div class="page active">
                <div class="stats-header">
                    <div class="stat-box"><small>Lucro Total</small><div id="lm-lucro">R$ 0,00</div></div>
                    <div class="stat-box"><small>Banca Atual</small><div id="lm-banca-atual">R$ 100,00</div></div>
                </div>

                <section class="market-card">
                    <div class="form-grid">
                        <input type="date" id="lm-data">
                        <input type="text" id="lm-timeA" placeholder="Mandante">
                        <input type="text" id="lm-timeB" placeholder="Visitante">
                        <input type="text" id="lm-lg" placeholder="Liga">
                        <input type="text" id="lm-pl" placeholder="Placar">
                        <input type="number" step="0.01" id="lm-oe" placeholder="Odd E">
                        <input type="number" step="0.01" id="lm-os" placeholder="Odd S">
                        <input type="number" id="lm-ent" placeholder="Stake">
                        <input type="number" id="lm-sai" placeholder="Retorno">
                    </div>
                    <button class="btn-submit" id="btn-add-lm">GRAVAR NA NUVEM</button>
                </section>

                <div class="table-card">
                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Evento</th>
                                <th>Liga</th>
                                <th>Placar</th>
                                <th>Odd E</th>
                                <th>Odd S</th>
                                <th>Stake</th>
                                <th>Retorno</th>
                                <th>P/L</th>
                                <th style="color: var(--accent)">% STAKE</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyLM"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCI0iUANVLaxqJJ351bpHkUmktGljPO7jQ",
            authDomain: "elitetraderconect.firebaseapp.com",
            databaseURL: "https://elitetraderconect-default-rtdb.firebaseio.com",
            projectId: "elitetraderconect",
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // Login / Logout
        document.getElementById('btn-login').onclick = () => {
            signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value);
        };
        document.getElementById('btn-logout').onclick = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) { 
                document.body.classList.add('logged-in');
                carregarDados();
            } else {
                document.body.classList.remove('logged-in');
            }
        });

        let trades = [];

        function carregarDados() {
            onValue(ref(db, 'trades_under'), (snapshot) => {
                trades = snapshot.val() || [];
                renderizar();
            });
        }

        document.getElementById('btn-add-lm').onclick = () => {
            const novo = {
                data: document.getElementById('lm-data').value,
                tA: document.getElementById('lm-timeA').value,
                tB: document.getElementById('lm-timeB').value,
                lg: document.getElementById('lm-lg').value,
                pl: document.getElementById('lm-pl').value,
                oe: parseFloat(document.getElementById('lm-oe').value),
                os: parseFloat(document.getElementById('lm-os').value),
                ent: parseFloat(document.getElementById('lm-ent').value),
                sai: parseFloat(document.getElementById('lm-sai').value)
            };
            trades.push(novo);
            set(ref(db, 'trades_under'), trades);
        };

        function renderizar() {
            const tbody = document.getElementById('tbodyLM');
            tbody.innerHTML = '';
            let totalPL = 0;

            trades.forEach((t, i) => {
                const lucro = t.sai - t.ent;
                totalPL += lucro;
                const perc = t.ent > 0 ? (lucro / t.ent * 100) : 0;
                const cor = lucro >= 0 ? 'pos' : 'neg';

                tbody.innerHTML += `
                    <tr>
                        <td>${t.data}</td>
                        <td>${t.tA} vs ${t.tB}</td>
                        <td>${t.lg}</td>
                        <td>${t.pl}</td>
                        <td>${t.oe}</td>
                        <td>${t.os}</td>
                        <td>R$ ${t.ent.toFixed(2)}</td>
                        <td>R$ ${t.sai.toFixed(2)}</td>
                        <td class="${cor}">R$ ${lucro.toFixed(2)}</td>
                        <td class="${cor}">${perc.toFixed(2)}%</td>
                        <td><button onclick="window.excluir(${i})">DEL</button></td>
                    </tr>
                `;
            });
            document.getElementById('lm-lucro').innerText = `R$ ${totalPL.toFixed(2)}`;
            document.getElementById('lm-banca-atual').innerText = `R$ ${(100 + totalPL).toFixed(2)}`;
        }

        window.excluir = (i) => {
            trades.splice(i, 1);
            set(ref(db, 'trades_under'), trades);
        };
    </script>
</body>
</html>
